<main class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()">
    <img class="login__logo" src="buzzer-logo.png" alt="Buzzer" width="72" height="72" />
    <h1>Sign in</h1>
    <p class="login__lead">Use a demo account to open the admin console.</p>

    @if (formError()) {
      <p class="banner banner--danger" role="alert">{{ formError() }}</p>
    }

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small>Enter a valid email address.</small>
      }
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small>Password is required.</small>
      }
    </label>

    <button class="btn btn--accent" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</main>
