name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::528757786463:role/buzzer-admin-console-deploy
          aws-region: ca-central-1

      - name: Publish to S3
        run: |
          aws s3 sync dist/buzzer-admin-console/browser "s3://${BUCKET}" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/buzzer-admin-console/browser/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache"
        env:
          BUCKET: buzzer-admin-console-web-528757786463

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"
        env:
          DISTRIBUTION_ID: E4HDW3KXMH6X5
